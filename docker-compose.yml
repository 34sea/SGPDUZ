services:
  db:
    image: mysql:8.0
    container_name: mysql_db_SGPDUZ
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: SGPDUZ@12345
      MYSQL_DATABASE: SGPDUZ
    ports:
      - "3307:3307"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: ./backend    
    container_name: node_backend_SGPDUZ
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: SGPDUZ@12345
      DB_NAME: SGPDUZ
    volumes:
      - ./backend:/app                  
      - /app/node_modules              
    depends_on:
      - db

  frontend:
    build: ./frontend     
    container_name: react_frontend_SGPDUZ
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    depends_on:
      - backend

volumes:
  mysql_data: